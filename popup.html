<!doctype html><html lang="ko"><meta charset="utf-8"><title>로아 인벤 필터</title><link rel="stylesheet" href="popup.css"><body>
<div class="popup-header"><h1 class="popup-title"><img src="icons/icon-48.png" width="28" height="28" alt="">로벤 인장 필터</h1><button type="button" id="enabled" class="color-switch main-switch" role="switch" aria-label="로벤 인장 필터 전체 켜기"><span class="thumb"></span></button></div><p>이 Chrome 확장 프로그램은 인벤이나 스마일게이트의 사전 승인을 받지 않은 비공식 확장 프로그램 입니다.</p><p>인장과 실제 프로필을 조회합니다.</p>
<p class="legend"><span class="legend-dot green"></span>인장 : 인장 공개 &amp; 기준 충족<br><span class="legend-dot yellow"></span>가라 인장 : 인장 공개 &amp; 기준 미충족<br><span class="legend-dot red"></span>노인장 : 인장 없음<br><span class="legend-dot black"></span>대기·실패·일부 정보 확인 불가</p>
<details class="criteria" open><summary>인장 기준 설정</summary><div class="criteria-body">
<label for="months">최근 갱신 기간 (개월)<input id="months" type="number" min="1" max="120" step="1" required></label>
<label for="minPower">전투력 (이상)<input id="minPower" type="number" min="0" max="1000000000" step="any" required></label>
<label for="minItem">아이템 레벨 (이상)<input id="minItem" type="number" min="0" max="1000000" step="any" required></label>
<p class="sentence-lines"><span>세 기준을 모두 만족하면 초록색입니다.</span><span>변경 시 자동 저장됩니다.</span></p></div></details>
<div class="master-filters">
<div class="master-filter"><span>게시글 필터</span><button type="button" id="posts" class="color-switch" role="switch" aria-label="게시글 필터"><span class="thumb"></span></button></div>
<div class="master-filter"><span>댓글 필터</span><button type="button" id="comments" class="color-switch" role="switch" aria-label="댓글 필터"><span class="thumb"></span></button></div>
</div>
<div class="color-row"><span class="legend-dot green"></span>인장<div class="switch-controls"><span id="green-state" class="switch-state"></span><button type="button" id="green" class="color-switch" role="switch" aria-label="인장 표시"><span class="thumb"></span></button></div></div>
<div class="color-row"><span class="legend-dot yellow"></span>가라인장<div class="switch-controls"><span id="yellow-state" class="switch-state"></span><button type="button" id="yellow" class="color-switch" role="switch" aria-label="가라인장 표시"><span class="thumb"></span></button></div></div>
<div class="color-row"><span class="legend-dot red"></span>노인장<div class="switch-controls"><span id="red-state" class="switch-state"></span><button type="button" id="red" class="color-switch" role="switch" aria-label="노인장 표시"><span class="thumb"></span></button></div></div>
<div class="color-row"><span class="legend-dot black"></span>판정 대기·실패<div class="switch-controls"><span id="black-state" class="switch-state"></span><button type="button" id="black" class="color-switch" role="switch" aria-label="판정 대기·실패 표시"><span class="thumb"></span></button></div></div>
<div class="cache-footer"><p class="sentence-lines"><span>검증 결과는 30분간 유지됩니다.</span><span>노인장과 검증 실패는 구분됩니다.</span></p><button id="clear">인장 검증<br>새로고침</button></div><p id="status" role="status"></p>
<script src="settings.js"></script><script src="popup.js"></script></body></html>
